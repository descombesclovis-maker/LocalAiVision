name: Build LocalVisionAI Windows EXE

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "codex/studio-296-4k-polish", "codex/studio-313-complete-ui-reconstruction", "codex/studio-314-brand-polish", "fix/studio-314-completion-motion-ui", "codex/studio-315-premium-stabilisation"]

concurrency:
  group: studio-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview reportlab pillow

      - name: Write build metadata
        id: meta
        shell: powershell
        run: |
          $source = Get-Content local_app\server.py -Raw
          $match = [regex]::Match($source, 'VERSION = "([^"]+)"')
          if (-not $match.Success) { throw "VERSION introuvable dans local_app/server.py" }
          $version = $match.Groups[1].Value
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          @{
            product_build = "316"
            version = $version
            build_tag = $tag
            commit = $env:GITHUB_SHA
            run_number = [int]$env:GITHUB_RUN_NUMBER
          } | ConvertTo-Json | Set-Content -Encoding UTF8 local_app\data\build_info.json
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Record source and resource integrity
        run: |
          python scripts/build_source_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze > build-dependencies.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_public_photo_faithfulness.cjs tests/test_web_generation_feedback.cjs tests/test_studio_progress.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare branded Windows icon and PE metadata
        run: python scripts/prepare_windows_brand.py

      - name: Build native executable
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --noupx --name LocalVisionAI ^
            --icon "build\branding\LocalAiStudio.ico" ^
            --version-file "build\branding\version_info.txt" ^
            --collect-all webview ^
            --collect-all reportlab ^
            --collect-all PIL ^
            --hidden-import local_app ^
            --hidden-import local_app.bootstrap_windows ^
            --hidden-import local_app.server ^
            --hidden-import local_app.llm ^
            --hidden-import local_app.workflows ^
            --hidden-import local_app.media_director ^
            --hidden-import local_app.comfy_progress ^
            --hidden-import local_app.web_builder ^
            --hidden-import local_app.presentation_assets ^
            --hidden-import local_app.brand_catalog ^
            --hidden-import local_app.web_briefing ^
            --hidden-import local_app.web_hybrid ^
            --hidden-import local_app.web_business_map ^
            --hidden-import local_app.web_map_no_website ^
            --hidden-import local_app.web_business_intelligence ^
            --hidden-import local_app.web_design_profile ^
            --hidden-import local_app.web_prospects ^
            --hidden-import local_app.web_prospect_filter ^
            --hidden-import local_app.web_business_photos ^
            --hidden-import local_app.web_sales_invoice ^
            --hidden-import local_app.web_sales_pipeline ^
            --hidden-import local_app.web_call_sheet ^
            --hidden-import local_app.web_sales_source ^
            --hidden-import local_app.web_sales_orders ^
            --hidden-import local_app.web_sales_registrar ^
            --hidden-import local_app.web_sales_delivery ^
            --hidden-import local_app.web_crm ^
            --hidden-import local_app.web_assets_bridge ^
            --hidden-import local_app.web_business_categories ^
            --hidden-import local_app.web_business_registry ^
            --hidden-import local_app.web_google_maps ^
            --hidden-import local_app.web_site_architecture ^
            --hidden-import local_app.web_creative_direction ^
            --hidden-import local_app.web_content_contract ^
            --hidden-import local_app.web_codex_writeback ^
            --hidden-import local_app.web_browser_qa ^
            --hidden-import local_app.integrations_cli ^
            --hidden-import local_app.nsfw_profile ^
            --add-data "local_app\web;local_app\web" ^
            --add-data "local_app\data;local_app\data" ^
            --add-data "build\branding\LocalAiStudio.ico;local_app\assets" ^
            --add-data "local_app\bootstrap_windows.py;local_app" ^
            --add-data "local_app\server.py;local_app" ^
            --add-data "local_app\llm.py;local_app" ^
            --add-data "local_app\nsfw_profile.py;local_app" ^
            --add-data "local_app\__init__.py;local_app" ^
            --add-data "text to image sdxl.json;." ^
            --add-data "Video Wan texte.json;." ^
            --add-data "Isolated HunyuanImage 2.1.json;." ^
            --add-data "Isolated HY-OmniWeaving T2V.json;." ^
            --add-data "Isolated HY-OmniWeaving I2V.json;." ^
            --add-data "HunyuanVideo 1.5 T2V.json;." ^
            --add-data "HunyuanVideo 1.5 I2V.json;." ^
            local_app\launcher.py

      - name: Verify approved full-logo icons in Windows Shell and native window
        run: python scripts/verify_windows_icon.py dist\LocalVisionAI.exe

      - name: Retain Windows icon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalAiStudio-OfficialIcon
          path: |
            build/branding/LocalAiStudio.ico
            build/branding/LocalAiStudio.png
            build/branding/icon-provenance.txt
            build/icon-qa/
          if-no-files-found: warn

      - name: Smoke test native EXE and extracted Python DLL
        shell: powershell
        run: |
          $env:LOCALVISIONAI_SKIP_SETUP = "1"
          $env:LOCALVISIONAI_UPDATE_SMOKE = "1"
          $target = (Resolve-Path "dist\LocalVisionAI.exe").Path
          $proc = Start-Process -FilePath $target -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { throw "Frozen EXE exited with code $($proc.ExitCode) (possible python311.dll extraction failure)." }
              try {
                $ping = Invoke-RestMethod "http://127.0.0.1:3000/api/ping" -TimeoutSec 2
                if ($ping.app -eq "LocalVisionAI" -and $ping.build_tag -eq "build-$env:GITHUB_RUN_NUMBER") {
                  $healthy = $true
                  break
                }
              } catch { }
            }
            if (-not $healthy) { throw "Frozen EXE failed the HTTP/bootstrap health check." }
            Write-Host "Frozen EXE and extracted Python runtime are healthy."
          } finally {
            & taskkill.exe /PID $proc.Id /T /F 2>$null | Out-Null
          }

      - name: End-to-end Windows auto-update and launcher hand-off
        shell: powershell
        run: python scripts/smoke_update_windows.py dist\\LocalVisionAI.exe

      - name: Optionally sign the EXE with an authentic Windows publisher certificate
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          WINDOWS_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_B64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGN_CERT_B64 -or -not $env:WINDOWS_SIGN_CERT_PASSWORD) {
            Write-Warning "No trusted Authenticode certificate configured: the EXE is unsigned. Windows may display SmartScreen warnings."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "localai-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_B64))
            $sign = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if (-not $sign) {
              $sign = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
                Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            }
            if (-not $sign) { throw "Windows signtool.exe is not installed." }
            & $sign.FullName sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_SIGN_CERT_PASSWORD dist\LocalVisionAI.exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
            $signature = Get-AuthenticodeSignature dist\LocalVisionAI.exe
            if ($signature.Status -ne "Valid") { throw "Authenticode signature verification failed: $($signature.Status)" }
            Write-Host "EXE signed and verified as $($signature.SignerCertificate.Subject)"
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LocalVisionAI.exe release\LocalVisionAI.exe
          Copy-Item ACTIVER_ACCES_TELEPHONE.bat release\ACTIVER_ACCES_TELEPHONE.bat
          Copy-Item OUVRIR_DANS_NAVIGATEUR.bat release\OUVRIR_DANS_NAVIGATEUR.bat
          Copy-Item MOBILE_SETUP.md release\MOBILE_SETUP.md
          Copy-Item local_app\data\build_info.json release\build_info.json
          Copy-Item local_app\data\source_manifest.json release\source_manifest.json
          Copy-Item build-dependencies.txt release\build-dependencies.txt
          Compress-Archive -Path release\* -DestinationPath LocalVisionAI-Windows.zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path LocalVisionAI-Windows.zip))
          try {
            foreach ($required in @('LocalVisionAI.exe','ACTIVER_ACCES_TELEPHONE.bat','OUVRIR_DANS_NAVIGATEUR.bat','MOBILE_SETUP.md')) {
              $entry = $archive.GetEntry($required)
              if (-not $entry -or $entry.Length -le 0) { throw "Missing or empty package entry: $required" }
            }
            $exe = $archive.GetEntry('LocalVisionAI.exe').Open()
            try {
              if ($exe.ReadByte() -ne 77 -or $exe.ReadByte() -ne 90) { throw 'Packaged executable has no MZ header.' }
            } finally { $exe.Dispose() }
          } finally { $archive.Dispose() }
          $hash=(Get-FileHash -Algorithm SHA256 LocalVisionAI-Windows.zip).Hash.ToLowerInvariant()
          "$hash  LocalVisionAI-Windows.zip" | Set-Content -Encoding ascii LocalVisionAI-Windows.sha256

      - name: Package desktop-only executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path desktop-only | Out-Null
          Copy-Item dist\LocalVisionAI.exe desktop-only\LocalVisionAI.exe
          Copy-Item local_app\data\build_info.json desktop-only\build_info.json
          Copy-Item local_app\data\source_manifest.json desktop-only\source_manifest.json
          Compress-Archive -Path desktop-only\* -DestinationPath LocalVisionAI-Desktop-Windows.zip -Force
          $hash=(Get-FileHash -Algorithm SHA256 LocalVisionAI-Desktop-Windows.zip).Hash.ToLowerInvariant()
          "$hash  LocalVisionAI-Desktop-Windows.zip" | Set-Content -Encoding ascii LocalVisionAI-Desktop-Windows.sha256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalVisionAI-Windows
          path: |
            LocalVisionAI-Windows.zip
            LocalVisionAI-Windows.sha256
            LocalVisionAI-Desktop-Windows.zip
            LocalVisionAI-Desktop-Windows.sha256
          if-no-files-found: error

      - name: Publish latest updater release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: LocalVisionAI v${{ steps.meta.outputs.version }}
          body: |
            Build Windows automatique de LocalVisionAI.
            Utilisé par le bouton « Mettre à jour LocalAiVision ».
            SHA-256 publié pour contrôle d'intégrité. La réputation SmartScreen requiert une signature Authenticode authentique et du temps : une compilation non signée peut encore susciter un avertissement.
          files: |
            LocalVisionAI-Windows.zip
            LocalVisionAI-Windows.sha256
          make_latest: true
          draft: false
          prerelease: false

  visual-qa:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 016962a194859320356b8c943ba41fca69b2cd38
          path: ui3155-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated QA dependencies
        shell: powershell
        run: |
          python -m pip install pillow reportlab
          npm install --prefix "$env:RUNNER_TEMP/studio315-qa" playwright@1.62.1
          $env:NODE_PATH="$env:RUNNER_TEMP/studio315-qa/node_modules"
          node "$env:RUNNER_TEMP/studio315-qa/node_modules/playwright/cli.js" install chromium ffmpeg
      - name: Capture preserved customized 315.5 baseline
        shell: powershell
        env:
          UI_BASELINE: '1'
          UI_SOURCE: ${{ github.workspace }}/ui3155-baseline
        run: |
          $env:NODE_PATH="$env:RUNNER_TEMP/studio315-qa/node_modules"
          $env:UI_OUTPUT='build/qa315/before3155'
          node scripts/qa_ui_313.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Chromium six-resolution and focused functional review
        shell: powershell
        run: |
          $env:NODE_PATH="$env:RUNNER_TEMP/studio315-qa/node_modules"
          $env:UI_OUTPUT='build/qa315/chromium/interactions'
          node scripts/qa_ui_314.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:UI_OUTPUT='build/qa315/chromium/screens'
          node scripts/qa_ui_313.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Edge six-resolution and focused functional review
        shell: powershell
        run: |
          $env:NODE_PATH="$env:RUNNER_TEMP/studio315-qa/node_modules"
          $env:UI_BROWSER_CHANNEL='msedge'
          $env:UI_OUTPUT='build/qa315/edge/screens'
          node scripts/qa_ui_313.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:UI_OUTPUT='build/qa315/edge/interactions'
          node scripts/qa_ui_314.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
        with:
          ref: 8a3ea1704e571779a313fc88cc9b96505e28df61
          path: audit1-baseline
      - name: Build 316 human audit baseline and functional review
        shell: powershell
        run: |
          $env:NODE_PATH="$env:RUNNER_TEMP/studio315-qa/node_modules"
          $env:UI_SOURCE="$env:GITHUB_WORKSPACE/audit1-baseline"
          $env:UI_BASELINE='1'
          $env:UI_OUTPUT='build/qa315/human-audit-1/before'
          node scripts/qa_human_audit_1.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:UI_SOURCE
          Remove-Item Env:UI_BASELINE
          $env:UI_OUTPUT='build/qa315/human-audit-1/after'
          node scripts/qa_human_audit_1.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual screenshots, videos and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalAiStudio-Build315-VisualQA
          path: build/qa315/
          if-no-files-found: error

  brand-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated export dependencies
        run: |
          python -m pip install pillow vtracer==0.6.15
          npm install --prefix "$RUNNER_TEMP/studio314-export" sharp
      - name: Reconstruct paths and export original and vector 4096px variants
        run: |
          python scripts/build_brand_derivatives_314.py
          NODE_PATH="$RUNNER_TEMP/studio314-export/node_modules" node scripts/render_brand_derivatives_314.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAiStudio-Build314-BrandDerivatives
          path: build/brand314/
          if-no-files-found: error
