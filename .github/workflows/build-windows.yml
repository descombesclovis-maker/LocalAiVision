name: Build LocalVisionAI Windows EXE

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview reportlab pillow

      - name: Write build metadata
        id: meta
        shell: powershell
        run: |
          $source = Get-Content local_app\server.py -Raw
          $match = [regex]::Match($source, 'VERSION = "([^"]+)"')
          if (-not $match.Success) { throw "VERSION introuvable dans local_app/server.py" }
          $version = $match.Groups[1].Value
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          @{
            version = $version
            build_tag = $tag
            commit = $env:GITHUB_SHA
            run_number = [int]$env:GITHUB_RUN_NUMBER
          } | ConvertTo-Json | Set-Content -Encoding UTF8 local_app\data\build_info.json
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Prepare branded Windows icon and PE metadata
        run: python scripts/prepare_windows_brand.py

      - name: Build native executable
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --noupx --name LocalVisionAI ^
            --icon "build\branding\LocalAiVision.ico" ^
            --version-file "build\branding\version_info.txt" ^
            --collect-all webview ^
            --collect-all reportlab ^
            --collect-all PIL ^
            --hidden-import local_app ^
            --hidden-import local_app.bootstrap_windows ^
            --hidden-import local_app.server ^
            --hidden-import local_app.llm ^
            --hidden-import local_app.workflows ^
            --hidden-import local_app.media_director ^
            --hidden-import local_app.comfy_progress ^
            --hidden-import local_app.web_builder ^
            --hidden-import local_app.brand_catalog ^
            --hidden-import local_app.web_briefing ^
            --hidden-import local_app.web_hybrid ^
            --hidden-import local_app.web_business_map ^
            --hidden-import local_app.web_map_no_website ^
            --hidden-import local_app.web_business_intelligence ^
            --hidden-import local_app.web_design_profile ^
            --hidden-import local_app.web_prospects ^
            --hidden-import local_app.web_prospect_filter ^
            --hidden-import local_app.web_business_photos ^
            --hidden-import local_app.web_sales_invoice ^
            --hidden-import local_app.web_crm ^
            --hidden-import local_app.web_assets_bridge ^
            --hidden-import local_app.web_business_categories ^
            --hidden-import local_app.web_business_registry ^
            --hidden-import local_app.web_google_maps ^
            --hidden-import local_app.web_site_architecture ^
            --hidden-import local_app.web_creative_direction ^
            --hidden-import local_app.web_content_contract ^
            --hidden-import local_app.web_codex_writeback ^
            --hidden-import local_app.web_browser_qa ^
            --hidden-import local_app.integrations_cli ^
            --hidden-import local_app.nsfw_profile ^
            --add-data "local_app\web;local_app\web" ^
            --add-data "local_app\data;local_app\data" ^
            --add-data "local_app\bootstrap_windows.py;local_app" ^
            --add-data "local_app\server.py;local_app" ^
            --add-data "local_app\llm.py;local_app" ^
            --add-data "local_app\nsfw_profile.py;local_app" ^
            --add-data "local_app\__init__.py;local_app" ^
            --add-data "text to image sdxl.json;." ^
            --add-data "Video Wan texte.json;." ^
            --add-data "Isolated HunyuanImage 2.1.json;." ^
            --add-data "Isolated HY-OmniWeaving T2V.json;." ^
            --add-data "Isolated HY-OmniWeaving I2V.json;." ^
            --add-data "HunyuanVideo 1.5 T2V.json;." ^
            --add-data "HunyuanVideo 1.5 I2V.json;." ^
            local_app\launcher.py

      - name: Smoke test native EXE and extracted Python DLL
        shell: powershell
        run: |
          $env:LOCALVISIONAI_SKIP_SETUP = "1"
          $env:LOCALVISIONAI_UPDATE_SMOKE = "1"
          $target = (Resolve-Path "dist\LocalVisionAI.exe").Path
          $proc = Start-Process -FilePath $target -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { throw "Frozen EXE exited with code $($proc.ExitCode) (possible python311.dll extraction failure)." }
              try {
                $ping = Invoke-RestMethod "http://127.0.0.1:3000/api/ping" -TimeoutSec 2
                if ($ping.app -eq "LocalVisionAI" -and $ping.build_tag -eq "build-$env:GITHUB_RUN_NUMBER") {
                  $healthy = $true
                  break
                }
              } catch { }
            }
            if (-not $healthy) { throw "Frozen EXE failed the HTTP/bootstrap health check." }
            Write-Host "Frozen EXE and extracted Python runtime are healthy."
          } finally {
            & taskkill.exe /PID $proc.Id /T /F 2>$null | Out-Null
          }

      - name: End-to-end Windows auto-update and launcher hand-off
        shell: powershell
        run: python scripts/smoke_update_windows.py dist\\LocalVisionAI.exe

      - name: Optionally sign the EXE with an authentic Windows publisher certificate
        shell: powershell
        env:
          WINDOWS_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_B64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGN_CERT_B64 -or -not $env:WINDOWS_SIGN_CERT_PASSWORD) {
            Write-Warning "No trusted Authenticode certificate configured: the EXE is unsigned. Windows may display SmartScreen warnings."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "localai-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_B64))
            $sign = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if (-not $sign) {
              $sign = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
                Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            }
            if (-not $sign) { throw "Windows signtool.exe is not installed." }
            & $sign.FullName sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_SIGN_CERT_PASSWORD dist\LocalVisionAI.exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
            $signature = Get-AuthenticodeSignature dist\LocalVisionAI.exe
            if ($signature.Status -ne "Valid") { throw "Authenticode signature verification failed: $($signature.Status)" }
            Write-Host "EXE signed and verified as $($signature.SignerCertificate.Subject)"
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LocalVisionAI.exe release\LocalVisionAI.exe
          Copy-Item ACTIVER_ACCES_TELEPHONE.bat release\ACTIVER_ACCES_TELEPHONE.bat
          Copy-Item MOBILE_SETUP.md release\MOBILE_SETUP.md
          Compress-Archive -Path release\* -DestinationPath LocalVisionAI-Windows.zip -Force
          $hash=(Get-FileHash -Algorithm SHA256 LocalVisionAI-Windows.zip).Hash.ToLowerInvariant()
          "$hash  LocalVisionAI-Windows.zip" | Set-Content -Encoding ascii LocalVisionAI-Windows.sha256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalVisionAI-Windows
          path: LocalVisionAI-Windows.zip
          if-no-files-found: error

      - name: Publish latest updater release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: LocalVisionAI v${{ steps.meta.outputs.version }}
          body: |
            Build Windows automatique de LocalVisionAI.
            Utilisé par le bouton « Mettre à jour LocalAiVision ».
            SHA-256 publié pour contrôle d'intégrité. La réputation SmartScreen requiert une signature Authenticode authentique et du temps : une compilation non signée peut encore susciter un avertissement.
          files: |
            LocalVisionAI-Windows.zip
            LocalVisionAI-Windows.sha256
          make_latest: true
          draft: false
          prerelease: false
