name: LocalAiWeb 3D checks
on:
  pull_request:
    branches: [main, codex/studio-296-4k-polish]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install document and creative image test dependencies
        run: python -m pip install reportlab pillow
      - name: Validate application regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate LocalAiWeb JavaScript syntax
        run: |
          node --check local_app/web/localaiweb.js
          node --check local_app/web/localaiweb-map.js
          node --check local_app/web/localaiweb-sales.js
          node --check local_app/web/localaiweb-inspector.js
          node --check local_app/web/localaiweb-projects.js
          node --check local_app/web/localaiweb-brand.js
          node --check local_app/web/studio-activity.js
          node --check local_app/web/studio-brands.js
          node --check local_app/web/studio-ads.js
          node --check local_app/web/templates/cinematic3d/app.js
          node --check local_app/web/templates/cinematic3d/quality.mjs
          node --check local_app/web/app.js
          node --check local_app/web/studio-qcm-shell.js
          node --check local_app/web/studio-qcm-home.js
          node --check local_app/web/studio-qcm-editor.js
          node --check local_app/web/studio-qcm-editor-rail.js
          node --check local_app/web/studio-qcm-projects.js
          node --check local_app/web/studio-qcm-map.js
          node --check local_app/web/studio-qcm-vision.js
          node --check local_app/web/studio-qcm-library.js
          node --check local_app/web/pwa-install.js
          node --check local_app/web/service-worker.js
      - name: Validate adaptive quality policy
        run: node --test tests/test_3d_quality.mjs
      - name: Test sent prompt context actions
        run: node --test tests/test_web_prompt_actions.mjs
      - name: Verify Studio layout, attachment and map in Windows Edge
        if: github.head_ref == 'codex/studio-296-4k-polish'
        shell: pwsh
        env:
          LOCALVISIONAI_SKIP_SETUP: '1'
        run: |
          $qa = Join-Path $env:RUNNER_TEMP studio-review
          npm install --prefix $qa --no-audit --no-fund playwright-core@1.58.2 leaflet@1.9.4
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $env:NODE_PATH = Join-Path $qa node_modules
          $env:QA_OUTPUT = Join-Path $qa evidence
          $server = Start-Process python -ArgumentList '-m','local_app.server' -PassThru
          try {
            for ($i=0; $i -lt 30; $i++) {
              try {Invoke-RestMethod http://127.0.0.1:3000/api/ping | Out-Null; break} catch {Start-Sleep 1}
            }
            node scripts/review_studio_54.cjs
            exit $LASTEXITCODE
          } finally {Stop-Process -Id $server.Id -ErrorAction SilentlyContinue}
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'codex/studio-296-4k-polish'
        with:
          name: Studio-54-Windows-Edge
          path: ${{ runner.temp }}/studio-review/evidence
      - name: Validate sales desk in Windows Edge (isolated customers and provider fixtures)
        if: github.head_ref == 'codex/studio-297-sales-autopilot'
        shell: pwsh
        run: |
          $qa = Join-Path $env:RUNNER_TEMP sales-review
          npm install --prefix $qa --no-audit --no-fund playwright-core@1.58.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $qa node_modules
          $env:QA_OUTPUT = Join-Path $qa evidence
          python scripts/review_sales_55.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'codex/studio-297-sales-autopilot'
        with:
          name: LocalAiWeb-Sales-55-Edge
          path: ${{ runner.temp }}/sales-review/evidence
